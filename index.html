<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विद्यार्थी पुस्तक भण्डार | App</title>
    
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { font-family: 'Hind', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); }
        #install-banner { display: none; }
    </style>
</head>
<body class="pb-32">

    <div id="install-banner" class="fixed top-0 left-0 w-full bg-yellow-400 text-black p-4 text-center font-bold z-50 shadow-md cursor-pointer" onclick="installApp()">
        📲 एप्प इनस्टॉल करें (Install App)
    </div>

    <header class="bg-[#b71c1c] text-white pt-10 pb-24 px-6 rounded-b-[50px] text-center shadow-lg">
        <h1 class="text-3xl font-bold">विद्यार्थी पुस्तक भण्डार</h1>
        <p class="text-sm opacity-90 mt-2">जौनपुर रोड, बदलापुर (डिग्री कॉलेज के बगल)</p>
    </header>

    <main class="px-5 -mt-12">
        <div class="mb-6">
            <input type="text" id="search" placeholder="किताब या सामान खोजें..." class="w-full p-4 rounded-2xl shadow-lg border-none focus:ring-2 focus:ring-red-600 outline-none">
        </div>

        <h2 class="text-xl font-bold text-gray-800 mb-4 border-l-4 border-red-700 pl-3">कैटेगरी चुनें</h2>
        
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-6 rounded-3xl shadow-md text-center border-b-4 border-red-600 active:scale-95 transition-transform">
                <i class="fas fa-book text-3xl text-red-600 mb-2"></i>
                <h3 class="font-bold">NCERT किताबें</h3>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-md text-center border-b-4 border-blue-700 active:scale-95 transition-transform">
                <i class="fas fa-user-graduate text-3xl text-blue-700 mb-2"></i>
                <h3 class="font-bold">कम्पटीशन बुक्स</h3>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-md text-center border-b-4 border-green-600 active:scale-95 transition-transform">
                <i class="fas fa-pencil-alt text-3xl text-green-600 mb-2"></i>
                <h3 class="font-bold">स्टेशनरी</h3>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-md text-center border-b-4 border-orange-500 active:scale-95 transition-transform">
                <i class="fas fa-university text-3xl text-orange-500 mb-2"></i>
                <h3 class="font-bold">स्कूल-कॉलेज</h3>
            </div>
        </div>

        <div class="mt-8 bg-white p-6 rounded-3xl shadow-lg border border-gray-100">
            <h3 class="font-bold text-gray-700 border-b pb-2 mb-3">दुकान के संचालक</h3>
            <p class="text-gray-600 font-semibold"><i class="fas fa-user-tie text-red-700 mr-2"></i> किशन मिश्रा एवं अमन मिश्रा</p>
            <p class="text-gray-500 text-sm mt-2">हमारे यहाँ सभी प्रकार की किताबें उचित मूल्य पर उपलब्ध हैं।</p>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full glass p-4 flex justify-around items-center border-t border-gray-200 shadow-2xl">
        <a href="tel:8115710365" class="flex flex-col items-center">
            <i class="fas fa-phone-alt text-red-700 text-xl"></i>
            <span class="text-[10px] font-bold mt-1 uppercase text-gray-600">अमन</span>
        </a>
        <a href="https://wa.me/918115129041" class="bg-green-500 text-white px-8 py-3 rounded-full font-bold shadow-lg flex items-center gap-2">
            <i class="fab fa-whatsapp"></i> ऑर्डर दें
        </a>
        <a href="tel:8115129041" class="flex flex-col items-center">
            <i class="fas fa-phone-alt text-blue-800 text-xl"></i>
            <span class="text-[10px] font-bold mt-1 uppercase text-gray-600">किशन</span>
        </a>
    </nav>

    <script>
        let deferredPrompt;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
        }
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('install-banner').style.display = 'block';
        });
        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choice) => {
                    if (choice.outcome === 'accepted') document.getElementById('install-banner').style.display = 'none';
                });
            }
        }
    </script>
</body>
</html>
